name: GoldHEN 14.00 read-only audit

on:
  push:
    branches:
      - codex/goldhen14-readonly-audit
  pull_request:
    branches:
      - main
    paths:
      - "raw13/hx_tables.js"
      - "research/hen14/hx_tables.json"
      - "raw13/hx1400_port.js"
      - "patches/1400.bin"
      - "raw13/patches/1400.bin"
      - "research/goldhen14/**"
      - ".github/workflows/goldhen14-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate HX1400 profile and patch blob
        run: node research/goldhen14/validate_tables.mjs
